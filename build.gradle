buildscript {
    repositories {
        mavenLocal()
        maven { url "https://nexus.ala.org.au/content/groups/public/" }
        maven { url "https://repo.grails.org/grails/core" }
    }
    dependencies {
        classpath "org.grails:grails-gradle-plugin:$grailsVersion"
        //classpath "com.bertramlabs.plugins:asset-pipeline-gradle:2.15.1" // CHANGE for GRAILS 5 upgarde
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:3.4.7" // new for grails 5
    }
}

version "3.1-SNAPSHOT"
group "org.grails.plugins"

apply plugin:"eclipse"
apply plugin:"idea"
apply plugin:"org.grails.grails-plugin"
//apply plugin:"org.grails.grails-plugin-publish" remove for GRAILS 5 upgrade
apply plugin:"org.grails.grails-gsp"
apply plugin:"asset-pipeline"
apply plugin:"maven-publish" // add for grails 5

repositories {
    mavenLocal()
    maven { url "https://nexus.ala.org.au/content/groups/public/" }
    maven { url "https://repo.grails.org/grails/core" }
}

dependencies { // totally changed for grails 5 upgrade 
    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "org.springframework.boot:spring-boot-autoconfigure"
    implementation "org.grails:grails-core"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-tomcat"
    implementation "org.grails:grails-dependencies"
    implementation "org.grails:grails-web-boot"
    implementation "org.grails.plugins:cache"
    implementation "org.grails.plugins:scaffolding"

    console "org.grails:grails-console"
    profile "org.grails.profiles:web-plugin"

    compileOnly "org.grails:grails-plugin-services"
    compileOnly "org.grails:grails-plugin-domain-class"

    //runtime "com.bertramlabs.plugins:asset-pipeline-grails:2.15.1" // CHANGE for grails 5 upgrade
    runtimeOnly "com.bertramlabs.plugins:asset-pipeline-grails:3.4.7" //  NEW for grails 5 upgrade

    testImplementation "org.grails:grails-plugin-testing"
    testImplementation "org.grails.plugins:geb"

    testRuntimeOnly "org.seleniumhq.selenium:selenium-htmlunit-driver:2.47.1"
    testRuntimeOnly "net.sourceforge.htmlunit:htmlunit:2.18"

    // webjars
    implementation 'org.webjars:underscorejs:1.8.3'
    implementation 'org.webjars:jquery:2.2.4'
    implementation 'org.webjars.bowergithub.protonet:jquery.inview:1.1.2'
    implementation 'org.webjars:handlebars:4.0.11-1'
    implementation 'org.webjars.npm:leaflet:0.7.7'
    implementation 'org.webjars.npm:leaflet-draw:0.4.14'

    implementation('org.webjars.bower:Leaflet.Coordinates:0.1.5') { // TODO get this NPM package into a webjar
        exclude group: 'org.webjars.bower', module: 'leaflet-dist' // exclude leaflet from bower as we have it from npm
    }
    implementation 'org.webjars.npm:leaflet-easybutton:1.2.0'
    implementation 'org.webjars.npm:leaflet-control-geocoder:1.5.5'
    implementation 'org.webjars.npm:leaflet.markercluster:0.5.0'
    implementation 'org.webjars.npm:leaflet-loading:0.1.24'
    implementation 'org.webjars.npm:leaflet-sleep:0.5.1'
    implementation 'org.webjars:font-awesome:4.7.0'
    implementation 'org.webjars.npm:urijs:1.18.10'
}

bootRun {
    jvmArgs('-Dspring.output.ansi.enabled=always')
    //addResources = true // remove for grails 5
}
// enable if you wish to package this plugin as a standalone application
// bootRepackage.enabled = false remove for grials 5


/* REMOVE GRIALS 5 UPGRADE
grailsPublish {
    // TODO: Provide values here
//    user = 'user'
//    key = 'key'
    websiteUrl = 'https://github.com/AtlasOfLivingAustralia/ala-map-plugin'
    issueTrackerUrl = 'https://github.com/AtlasOfLivingAustralia/ala-map-plugin/issues'
    vcsUrl = 'https://github.com/AtlasOfLivingAustralia/ala-map-plugin'
    githubSlug = 'AtlasOfLivingAustralia/ala-map-plugin'
    license {
        name = 'MPL-2.0'
    }
    title = "ALA Map Plugin"
    desc = "Provides occurence maps for ALA applications"
    developers = ["ALA":"support@ala.org.au"]
}
*/

assets {
    packagePlugin = (project == rootProject)
    minifyJs = true

    excludes = [
        'regex:.*hintrc.*\\.js'
    ]
}

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases' }"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {
            pom.withXml {
                def pomNode = asNode()
                pomNode.dependencyManagement.replaceNode {}

                // simply remove dependencies without a version
                // version-less dependencies are handled with dependencyManagement
                // see https://github.com/spring-gradle-plugins/dependency-management-plugin/issues/8 for more complete solutions
                pomNode.dependencies.dependency.findAll {
                    it.version.text().isEmpty()
                }.each {
                    it.replaceNode {}
                }
            }
            from components.java

        }
    }
}